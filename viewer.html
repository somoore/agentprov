<!doctype html>
<!--
  agentprov viewer — a pure renderer of a chain.jsonl that the recorder emits.
  No build step, no dependencies, no network. It recomputes the SAME hash chain
  the Go CLI does (crypto.subtle SHA-256 over the identical field layout), so what
  you see is the real verification, not a mock. It visualizes only what the
  deterministic recorder proves: the causal chain, broken links, and gaps.
  It invents nothing — no severity, no scores, no guesses.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentprov — flight recorder</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #11151f; --line: #1e2433; --ink: #e6edf3;
    --dim: #7d8694; --trusted: #3fb950; --untrusted: #d29922; --neutral: #58a6ff;
    --broken: #f85149; --gap: #f85149; --ok: #3fb950; --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 20px 28px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  header .tag { color: var(--dim); font-size: 13px; }
  header .spacer { flex: 1; }
  .drop {
    margin: 48px auto; max-width: 520px; padding: 56px 32px; text-align: center;
    border: 1.5px dashed var(--line); border-radius: 14px; color: var(--dim);
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--neutral); background: #0e1422; color: var(--ink); }
  .drop strong { color: var(--ink); display: block; font-size: 16px; margin-bottom: 6px; }
  .wrap { display: none; padding: 0 28px 80px; }
  .status {
    display: flex; gap: 12px; flex-wrap: wrap; padding: 18px 0; align-items: center;
  }
  .pill {
    padding: 6px 12px; border-radius: 999px; font: 12px/1 var(--mono);
    border: 1px solid var(--line); background: var(--panel); color: var(--dim);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .pill b { color: var(--ink); font-weight: 600; }
  .pill.ok { border-color: #1d3b27; color: var(--ok); }
  .pill.bad { border-color: #4a1f1f; color: var(--broken); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .chain { margin-top: 8px; }
  .node {
    position: relative; display: flex; gap: 14px; padding: 9px 0 9px 0;
  }
  .rail { position: relative; width: 18px; flex: 0 0 18px; }
  .rail::before {
    content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px;
    background: var(--line);
  }
  .node:first-child .rail::before { top: 14px; }
  .node:last-child .rail::before { bottom: calc(100% - 14px); }
  .marker {
    position: absolute; left: 3px; top: 9px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--neutral); border: 2px solid var(--bg);
    z-index: 1;
  }
  .body {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; padding: 10px 14px; min-width: 0;
  }
  .row1 { display: flex; align-items: center; gap: 10px; }
  .op {
    font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .5px;
    padding: 3px 7px; border-radius: 5px; background: #1a2030; color: var(--dim);
  }
  .seq { color: var(--dim); font: 11px/1 var(--mono); }
  .tool { color: var(--ink); font-weight: 600; }
  .summary { color: var(--dim); margin-top: 4px; font-size: 13px; }
  .hash { color: #4a5160; font: 10px/1 var(--mono); margin-top: 5px; }

  /* trust coloring on the marker + a left accent */
  .t-trusted .marker { background: var(--trusted); }
  .t-untrusted .marker { background: var(--untrusted); }
  .t-untrusted .body { border-left: 2px solid var(--untrusted); }
  .heartbeat .marker { background: #30363d; width: 8px; height: 8px; left: 5px; top: 11px; }
  .heartbeat .body { background: transparent; border-style: dashed; border-color: #232a38; }
  .heartbeat .op { background: transparent; }

  /* the money shots: broken + gap */
  .broken .marker { background: var(--broken); box-shadow: 0 0 0 4px rgba(248,81,73,.15); }
  .broken .body { border-color: var(--broken); background: #1a1012; }
  .broken .why { color: var(--broken); font: 11px/1.4 var(--mono); margin-top: 6px; }
  .gapbar {
    margin: 4px 0 4px 32px; padding: 10px 14px; border-radius: 9px;
    border: 1px dashed var(--gap); color: var(--gap);
    font: 12px/1.4 var(--mono); background: #160f10;
  }
  .legend { color: var(--dim); font-size: 12px; padding: 14px 0 4px; display: flex; gap: 18px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 9px; height: 9px; border-radius: 50%; }
</style>
</head>
<body>
<header>
  <h1>agentprov</h1>
  <span class="tag">tamper-evident flight recorder · chain viewer</span>
  <span class="spacer"></span>
  <span class="tag" id="loaded"></span>
</header>

<div class="drop" id="drop">
  <strong>Drop a chain.jsonl here</strong>
  or click to choose — produced by <code>agentprov record</code> / <code>run</code>
  <input type="file" id="file" accept=".jsonl,.json,application/json" hidden>
</div>

<div class="wrap" id="wrap">
  <div class="status" id="status"></div>
  <div class="legend">
    <span><i class="sw" style="background:var(--trusted)"></i> trusted (agent action)</span>
    <span><i class="sw" style="background:var(--untrusted)"></i> untrusted (external content enters)</span>
    <span><i class="sw" style="background:#30363d"></i> recorder heartbeat</span>
    <span><i class="sw" style="background:var(--broken)"></i> broken link</span>
  </div>
  <div class="chain" id="chain"></div>
</div>

<script>
const $ = s => document.querySelector(s);

// Recompute contentHash EXACTLY as the Go CLI does:
//   "%d\x00%s\x00%s..." over seq,prev,op,span,parent,tool,trust,summary,time
//   then "\x00k=v" for each attr key in sorted order.
const NUL = "\x00";
async function sha256hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function hashInput(prev, n) {
  let s = [n.seq, prev, n.op||"", n.span_id||"", n.parent_span_id||"",
           n.tool||"", n.trust||"", n.summary||"", n.time||""].join(NUL);
  const attrs = n.attrs || {};
  for (const k of Object.keys(attrs).sort()) s += NUL + k + "=" + attrs[k];
  return s;
}

async function analyze(nodes) {
  let prev = "GENESIS";
  let firstBreak = -1, breakWhy = "";
  let heartbeats = 0, cleanExit = false;
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    if (firstBreak < 0) {
      if (n.prev_hash !== prev) {
        firstBreak = i; breakWhy = "a node was DROPPED, inserted, or reordered (prev_hash mismatch)";
      } else {
        const want = await sha256hex(hashInput(prev, n));
        if (want !== n.hash) { firstBreak = i; breakWhy = "content ALTERED (recomputed hash ≠ stored)"; }
      }
    }
    if (n.op === "heartbeat") {
      heartbeats++;
      if ((n.summary||"").includes("clean exit")) cleanExit = true;
    }
    prev = n.hash;
  }
  return { firstBreak, breakWhy, heartbeats, cleanExit };
}

function nodeEl(n, i, broken, brokenWhy) {
  const el = document.createElement("div");
  let cls = "node t-" + (n.trust || "unknown");
  if (n.op === "heartbeat") cls += " heartbeat";
  if (broken) cls += " broken";
  el.className = cls;
  const tool = n.tool ? `<span class="tool">${esc(n.tool)}</span>` : "";
  const why = broken ? `<div class="why">⚠ CHAIN BROKEN — ${esc(brokenWhy)} — everything below is unverifiable</div>` : "";
  el.innerHTML = `
    <div class="rail"><div class="marker"></div></div>
    <div class="body">
      <div class="row1"><span class="op">${esc(n.op||"?")}</span> ${tool}<span class="seq">#${n.seq}</span></div>
      ${n.summary ? `<div class="summary">${esc(n.summary)}</div>` : ""}
      <div class="hash">${(n.hash||"").slice(0,24)}…</div>
      ${why}
    </div>`;
  return el;
}

function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

async function render(text) {
  const nodes = text.split("\n").map(l => l.trim()).filter(Boolean)
    .map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
  if (!nodes.length) { alert("No chain nodes found in that file."); return; }

  const res = await analyze(nodes);
  $("#drop").style.display = "none";
  $("#wrap").style.display = "block";
  $("#loaded").textContent = nodes.length + " nodes";

  // status pills
  const intact = res.firstBreak < 0;
  const status = $("#status"); status.innerHTML = "";
  status.appendChild(pill(intact ? "ok" : "bad", "integrity",
    intact ? "intact — every link verifies" : "BROKEN at #" + nodes[res.firstBreak].seq));
  status.appendChild(pill(res.cleanExit ? "ok" : "bad", "liveness",
    res.cleanExit ? res.heartbeats + " heartbeats · clean exit"
                  : "⚠ GAP — no clean-exit heartbeat (run truncated or silenced)"));

  // chain
  const chain = $("#chain"); chain.innerHTML = "";
  for (let i = 0; i < nodes.length; i++) {
    chain.appendChild(nodeEl(nodes[i], i, i === res.firstBreak, res.breakWhy));
  }
  // the gap: if no clean exit, show the hole at the end
  if (!res.cleanExit && res.firstBreak < 0) {
    const g = document.createElement("div");
    g.className = "gapbar";
    g.textContent = "⚠ recorder went dark here — no clean-exit heartbeat. A plain log would look complete; this shows the silence.";
    chain.appendChild(g);
  }
}

function pill(kind, label, val) {
  const p = document.createElement("span");
  p.className = "pill " + kind;
  p.innerHTML = `<span class="dot"></span>${label}: <b>${esc(val)}</b>`;
  return p;
}

// wiring: file picker + drag/drop
const drop = $("#drop"), file = $("#file");
drop.onclick = () => file.click();
file.onchange = e => { const f = e.target.files[0]; if (f) f.text().then(render); };
["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) f.text().then(render); });

// optional: ?chain=path auto-loads when served (agentprov view does this)
const auto = new URLSearchParams(location.search).get("chain");
if (auto) fetch(auto).then(r => r.text()).then(render).catch(()=>{});
</script>
</body>
</html>
