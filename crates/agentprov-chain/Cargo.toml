[package]
name = "agentprov-chain"
version.workspace = true
description = "Build a signed semantic provenance chain (prompt/tool-call/result events) from an AI coding-agent transcript."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

# agentprov-chain — Tier-2 (untrusted-parse) recorder that turns a Claude/Codex
# transcript into the SAME signed, hash-chained chain.jsonl the Go recorder emits,
# so the existing viewer.html verifies it unchanged.
[dependencies]
agentprov-integrity = { path = "../agentprov-integrity" }
sha2 = { workspace = true }
# Tier-2: parsing arbitrary nested transcript JSON by hand would be a bug farm, so
# serde/serde_json are allowed here. NOTE: do NOT enable serde_json's
# `preserve_order` — its default BTreeMap (sorted keys) matches Go's sorted
# json.Marshal of the map-fallback in flatten().
serde = { version = "1", features = ["derive"] }
serde_json = "1"
